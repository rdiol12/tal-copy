plugins { id 'com.android.application' }
android {
    namespace 'com.tal.pocketflow'
    compileSdk 35
    defaultConfig { applicationId 'com.tal.pocketflow'; minSdk 26; targetSdk 35; versionCode 43; versionName '0.15.1' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        debug { storeFile file('development.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' }
    }
    buildTypes { release { minifyEnabled false } }
    testOptions { unitTests.includeAndroidResources = true }
}
dependencies {
    implementation 'com.google.android.gms:play-services-auth:22.0.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
tasks.withType(Test).configureEach {
    ['https.proxyHost','https.proxyPort','http.proxyHost','http.proxyPort'].each { name ->
        if (System.getProperty(name) != null) systemProperty name, System.getProperty(name)
    }
    systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
}
