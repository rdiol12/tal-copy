# Xcode project definition. CI runs `xcodegen generate` in this folder to
# produce iosApp.xcodeproj, so the .xcodeproj itself is not committed.
name: iosApp
options:
  bundleIdPrefix: com.tal
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.15.1"
    CURRENT_PROJECT_VERSION: "43"
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    scheme: {}
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: PocketFlow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: he
        CFBundleLocalizations: [he]
        NSFaceIDUsageDescription: PocketFlow uses Face ID to protect entry to the app when you turn on entry protection.
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        # pocketflow://... links: salary from ShiftHours, Wallet taps passed on by Shortcuts.
        CFBundleURLTypes:
          - CFBundleURLName: com.tal.pocketflow
            CFBundleURLSchemes: [pocketflow]
        LSApplicationQueriesSchemes: [shortcuts]
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tal.pocketflow
        PRODUCT_NAME: PocketFlow
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: "NO"
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - ComposeApp
    dependencies:
      - target: PocketFlowWidgets
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping Gradle build task invocation due to OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED environment variable set to \"YES\""
            exit 0
          fi
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode

  # Home-screen widgets: quick actions that open the app through pocketflow://widget/... links.
  PocketFlowWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: widgets
    info:
      path: widgets/Info.plist
      properties:
        CFBundleDisplayName: PocketFlow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tal.pocketflow.widgets
        PRODUCT_NAME: PocketFlowWidgets
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: "YES"
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
